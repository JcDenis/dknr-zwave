# Shared workflow, see https://github.com/dknr-domotic/workflows
name: Delete old workflow runs

on:
  schedule:
    - cron: '45 11 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'retain days'
        required: true
        default: 15
        type: choice
        options:
        - 1
        - 2
        - 7
        - 15

jobs:
  del_runs:
    permissions:
      actions: write
      contents: read
    uses: dknr-domotic/workflows/.github/workflows/clean_repository.yml@master
    with:
      days: ${{ inputs.days || '15' }}
